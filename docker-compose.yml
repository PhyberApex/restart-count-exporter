services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=0

  restart-count-exporter:
    image: ghcr.io/phyberapex/restart-count-exporter:latest
    container_name: restart-count-exporter
    restart: unless-stopped
    ports:
      - "9103:9103"
    environment:
      - DOCKER_API_BASE=http://docker-socket-proxy:2375
      - SCRAPE_INTERVAL_S=5
    depends_on:
      - docker-socket-proxy
